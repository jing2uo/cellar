# Builds the two binaries (see Makefile / README.md):
#   cellar      GUI (Wails v3, GTK 4 / WebKitGTK 6), built on debian:sid so it
#               links nothing newer than org.gnome.Platform//51 provides
#   cellar-cli  static nogui launcher, the one FlatPark wine packages ship
# release.yml calls it with the version of the release being cut; otherwise
# the version comes from scripts/version.sh.
name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        type: string
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    container: docker.io/library/debian:sid
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates git make gcc libc6-dev pkg-config \
            libgtk-4-dev libwebkitgtk-6.0-dev

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # the tags, for scripts/version.sh

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          echo "VERSION=${VERSION:-$(scripts/version.sh)}" >> "$GITHUB_ENV"

      - name: Test
        run: make test

      - name: Build CLI
        run: make cli

      - name: Build GUI
        run: |
          go build -tags production -trimpath \
            -ldflags="-s -w -X main.version=$VERSION" -o dist/cellar .

      - uses: actions/upload-artifact@v7
        with:
          name: cellar-linux-x86_64
          path: |
            dist/cellar
            dist/cellar-cli
          if-no-files-found: error
