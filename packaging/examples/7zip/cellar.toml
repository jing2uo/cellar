# 7-Zip: the vendor's official x64 installer, unmodified (extra-data).
# apply_extra (`cellar extract`) unpacks it with 7z once at install time;
# every user's prefix links C:\Program Files\7-Zip to that read-only copy.

profiles = ["cjk"]  # CJK fonts; the UI language follows the user's own LANG

[install]
source = "7zip-setup.exe"   # the extra-data filename
method = "extract"
target = 'C:\Program Files\7-Zip'

[drives]
# No Z: (the base profile drops it): Windows file dialogs see the home
# folder as H: only. Files opened from the desktop arrive through Y:.
h = "~"

[[apps]]
id = "7zfm"
name = "7-Zip"
exe = 'C:\Program Files\7-Zip\7zFM.exe'
