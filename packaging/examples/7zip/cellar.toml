# 7-Zip: the vendor's official x64 installer, unmodified (extra-data). It is
# not unpacked at install time: on first launch cellar runs it silently in
# the user's prefix, as a person would in Bottles, and again whenever the
# package brings a newer installer.

locale = "en_US"
font_sets = ["core"]  # Arial, Times New Roman, Courier New: Liberation

[install]
source = "7zip-setup.exe"   # the extra-data filename
method = "run"
args = ["/S"]               # 7-Zip's installer: silent, default folder

[drives]
# No Z: (the defaults drop it): Windows file dialogs see the home
# folder as H: only. Files opened from the desktop arrive through Y:.
h = "~"

[[apps]]
id = "7zfm"
name = "7-Zip"
exe = 'C:\Program Files\7-Zip\7zFM.exe'
