# Prototype of a FlatPark wine package: the vendor's Windows installer as
# extra-data (unmodified), Wine from the org.winehq.Wine base, and cellar's
# static launcher reading /app/share/cellar/cellar.toml.
id: org.notepad_plus_plus.NotepadPlusPlus
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
base: org.winehq.Wine
base-version: stable-26.08
command: cellar
finish-args:
  - --share=ipc
  # Wine draws through X11 (XWayland on Wayland desktops).
  - --socket=x11
  - --device=dri
  # New-WoW64 Wine needs it for any 32-bit Windows code (no i386 libs).
  - --allow=multiarch
  # Shown to Windows programs as H: (see cellar.toml).
  - --filesystem=home
modules:
  - name: cellar
    buildsystem: simple
    build-commands:
      - install -Dm755 cellar /app/bin/cellar
      - install -Dm644 cellar.toml /app/share/cellar/cellar.toml
      - install -Dm755 apply_extra /app/bin/apply_extra
      - install -Dm644 org.notepad_plus_plus.NotepadPlusPlus.desktop /app/share/applications/org.notepad_plus_plus.NotepadPlusPlus.desktop
      - install -Dm644 org.notepad_plus_plus.NotepadPlusPlus.png /app/share/icons/hicolor/256x256/apps/org.notepad_plus_plus.NotepadPlusPlus.png
      - install -Dm644 org.notepad_plus_plus.NotepadPlusPlus.metainfo.xml /app/share/metainfo/org.notepad_plus_plus.NotepadPlusPlus.metainfo.xml
    sources:
      - type: file
        path: ../../../dist/cellar-cli
        dest-filename: cellar
      - type: file
        path: cellar.toml
      - type: file
        path: org.notepad_plus_plus.NotepadPlusPlus.desktop
      - type: file
        path: org.notepad_plus_plus.NotepadPlusPlus.png
      - type: file
        path: org.notepad_plus_plus.NotepadPlusPlus.metainfo.xml
      - type: script
        dest-filename: apply_extra
        commands:
          - exec /app/bin/cellar extract
      - type: extra-data
        filename: npp-setup.exe
        url: https://github.com/notepad-plus-plus/notepad-plus-plus/releases/download/v8.9.8.1/npp.8.9.8.1.Installer.x64.exe
        sha256: 26f3bcced788fadbac4e7e577b430ea2ce6060cf3bcad993ef4612ecd7d743da
        size: 6963432
