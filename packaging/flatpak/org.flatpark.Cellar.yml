# Local test build: packages dist/cellar (make gui) as-is. The release build
# compiles in the GNOME SDK instead.
#
# No Wine of its own. The "system" runner is org.winehq.Wine as the user
# installed it from Flathub (stable-26.08 is built on
# org.freedesktop.Platform//26.08, which GNOME 51 is built on), read in place
# through the grants below. Downloaded community runners live in the app's
# data dir.
id: org.flatpark.Cellar
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
command: cellar
finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  # x11, not fallback-x11: Wine draws through its X11 driver, which needs the
  # X socket even when the GUI itself is on Wayland.
  - --socket=x11
  - --socket=pulseaudio
  # Same reach as the Bottles Flatpak it replaces: USB keys and other
  # devices some Windows programs talk to, and the user folders.
  - --device=all
  - --filesystem=xdg-download
  - --filesystem=xdg-documents
  - --filesystem=xdg-desktop:create
  # Menu launchers for apps (cellar desktop / the GUI's launcher button).
  - --filesystem=xdg-data/applications:create
  # Read-only, to import bottles from the Bottles Flatpak.
  - --filesystem=~/.var/app/com.usebottles.bottles/data/bottles:ro
  # Read-only, to import prefixes of a system-installed cellar.
  - --filesystem=~/.local/share/cellar/prefixes:ro
  # org.winehq.Wine and its Gecko / Mono extensions where flatpak installs
  # them, per user and system-wide: the "system" runner, and the add-ons
  # cellar links into prefixes that turn on [init] gecko / mono.
  - --filesystem=~/.local/share/flatpak/app/org.winehq.Wine:ro
  - --filesystem=~/.local/share/flatpak/runtime/org.winehq.Wine.gecko:ro
  - --filesystem=~/.local/share/flatpak/runtime/org.winehq.Wine.mono:ro
  - --filesystem=/var/lib/flatpak/app/org.winehq.Wine:ro
  - --filesystem=/var/lib/flatpak/runtime/org.winehq.Wine.gecko:ro
  - --filesystem=/var/lib/flatpak/runtime/org.winehq.Wine.mono:ro
  # New-WoW64 Wine runs 32-bit Windows code with no 32-bit Linux libraries,
  # but Flatpak's default seccomp filter still kills it: without this every
  # 32-bit program fails in NtCreateUserProcess.
  - --allow=multiarch

# Only legacy (non-WoW64) community runners such as Bottles' vaniglia need these.
# Not auto-downloaded: org.winehq.Wine and the recommended runners are WoW64 and
# load no i386 Linux libraries. Turning on 32-bit runners in the settings
# shows the install command when they are missing.
add-extensions:
  org.freedesktop.Platform.Compat.i386:
    directory: lib/i386-linux-gnu
    version: '26.08'
    no-autodownload: true
    autodelete: false
  org.freedesktop.Platform.GL32:
    directory: lib/i386-linux-gnu/GL
    version: '1.4'
    versions: 26.08;26.08-extra;1.4
    subdirectories: true
    no-autodownload: true
    autodelete: false
    add-ld-path: lib
    merge-dirs: vulkan/icd.d;glvnd/egl_vendor.d;egl/egl_external_platform.d;OpenCL/vendors;lib/dri;lib/d3d;lib/gbm;vulkan/explicit_layer.d;vulkan/implicit_layer.d;vdpau

modules:
  - name: cellar
    buildsystem: simple
    build-commands:
      - install -Dm755 cellar /app/bin/cellar
      - install -Dm644 org.flatpark.Cellar.desktop /app/share/applications/org.flatpark.Cellar.desktop
      - install -Dm644 org.flatpark.Cellar.svg /app/share/icons/hicolor/scalable/apps/org.flatpark.Cellar.svg
      # Mount points of the i386 extensions above.
      - mkdir -p /app/lib/i386-linux-gnu/GL
    sources:
      - type: file
        path: ../../dist/cellar
      - type: file
        path: org.flatpark.Cellar.desktop
      - type: file
        path: org.flatpark.Cellar.svg
