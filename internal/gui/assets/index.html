<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Cellar</title>
<style>
:root {
  --bg: #f6f5f3; --panel: #ffffff; --side: #efedea; --line: #e2dfda;
  --text: #1f1d1a; --mute: #77726b; --accent: #8a2c3b; --accent-soft: #f3e6e8;
  --ok: #2f7d4f; --warn: #a86a12; --err: #b3261e; --mono: "JetBrains Mono", "Noto Sans Mono CJK SC", monospace;
}
/* Dark follows the system unless the settings pick a theme (data-theme). */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1b1a19; --panel: #232220; --side: #161514; --line: #34322f;
    --text: #ebe8e3; --mute: #9b958c; --accent: #e07a8b; --accent-soft: #3a2429;
    --ok: #6cc28f; --warn: #e0a54a; --err: #ef6b62;
  }
}
:root[data-theme="dark"] {
  --bg: #1b1a19; --panel: #232220; --side: #161514; --line: #34322f;
  --text: #ebe8e3; --mute: #9b958c; --accent: #e07a8b; --accent-soft: #3a2429;
  --ok: #6cc28f; --warn: #e0a54a; --err: #ef6b62;
}
:root[data-theme="light"] { color-scheme: light; }
:root[data-theme="dark"] { color-scheme: dark; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  font: 14px/1.5 "Inter", "Noto Sans CJK SC", system-ui, sans-serif;
  background: var(--bg); color: var(--text); display: flex; overflow: hidden;
  -webkit-user-select: none; user-select: none;
}
aside { width: 240px; background: var(--side); border-right: 1px solid var(--line); display: flex; flex-direction: column; }
.brand { padding: 18px 18px 10px; font-weight: 650; font-size: 16px; letter-spacing: .2px; display: flex; gap: 8px; align-items: center; }
.brand img { width: 24px; height: 24px; }
.list { flex: 1; overflow: auto; padding: 4px 8px; }
.group { color: var(--mute); font-size: 12px; padding: 12px 10px 4px; }
.group.gh { display: flex; align-items: center; justify-content: space-between; padding: 14px 4px 6px 10px; font-size: 14px; font-weight: 600; color: var(--text); }
.group.gh .ico { width: 18px; height: 18px; }
.gadd { border: none; background: none; padding: 3px; border-radius: 6px; color: var(--mute); display: flex; line-height: 0; }
.gadd:hover { color: var(--text); background: color-mix(in srgb, var(--text) 8%, transparent); }
.item { padding: 8px 10px; border-radius: 8px; cursor: default; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.item:hover { background: color-mix(in srgb, var(--text) 6%, transparent); }
.item.sel { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.item small { color: var(--mute); font-weight: 400; }
.item.dragging { position: fixed; z-index: 50; pointer-events: none; background: var(--panel); color: var(--accent);
  border: 1px solid var(--accent); box-shadow: 0 10px 28px rgba(0,0,0,.28); transform: scale(1.04) rotate(-1deg); }
.item.slot { border: 2px dashed color-mix(in srgb, var(--accent) 55%, transparent); background: var(--accent-soft); }
.item.slot:hover { background: var(--accent-soft); }
.item.shift { transition: transform .15s ease; }
.withico { display: flex; align-items: center; gap: 8px; }
button.withico { gap: 6px; }
.ico { width: 16px; height: 16px; flex: none; }
.sys { padding: 6px 8px; border-top: 1px solid var(--line); }
main { flex: 1; min-width: 0; overflow: auto; padding: 28px 32px; }
h1 { margin: 0; font-size: 22px; font-weight: 650; }
.meta { color: var(--mute); margin-top: 4px; word-break: break-all; display: flex; gap: 14px; flex-wrap: wrap; }
.head { flex-wrap: wrap; display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; margin-bottom: 24px; }
.actions { display: flex; gap: 8px; }
a { color: var(--accent); }
button {
  white-space: nowrap; font: inherit; border: 1px solid var(--line); background: var(--panel); color: var(--text);
  padding: 6px 14px; border-radius: 8px; cursor: default;
}
button:hover { border-color: var(--mute); }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
button:disabled { opacity: .5; }
section { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; margin-bottom: 16px; }
section h2 { font-size: 13px; font-weight: 600; color: var(--mute); margin: 0 0 12px; text-transform: uppercase; letter-spacing: .6px; }
.apps { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; }
.app { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; }
.app b { font-weight: 600; }
.app .top { display: flex; gap: 10px; align-items: center; height: 2.7em; }
.app .top b { flex: 1; min-width: 0; line-height: 1.35; overflow: hidden; overflow-wrap: anywhere;
  display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; }
.app .dots { border: none; background: none; padding: 0 4px; color: var(--mute); font-size: 18px; line-height: 1; }
.app img { width: 32px; height: 32px; object-fit: contain; }
/* Buttons keep their text on one line; when the card is too narrow for
   both (English labels are longer), the second wraps and both widen. */
.app .btns { display: flex; flex-wrap: wrap; gap: 6px; margin-top: auto; }
.app .btns button { flex: 1 1 auto; white-space: nowrap; }
.app code { color: var(--mute); font-size: 11.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.badge { font-size: 11.5px; padding: 1px 8px; border-radius: 99px; border: 1px solid currentColor; }
.s-applied, .item small.s-applied { color: var(--ok); } .s-changed, .s-new, .item small.s-changed, .item small.s-new { color: var(--warn); } .s-error, .item small.s-error { color: var(--err); }
.changes { font-family: var(--mono); font-size: 12px; margin: 0; padding: 0; list-style: none; max-height: 260px; overflow: auto; }
.changes li { padding: 3px 0; border-bottom: 1px dashed var(--line); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.op { display: inline-block; width: 56px; font-weight: 600; }
.op-set, .op-link, .op-map, .op-init, .op-download { color: var(--ok); } .op-delete, .op-unlink, .op-unmap { color: var(--err); } .op-update { color: var(--warn); }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
td { white-space: nowrap; padding: 6px 4px; border-bottom: 1px solid var(--line); }
/* The command takes what width is left and is cut short, not the page widened. */
td.cmd { width: 100%; max-width: 0; overflow: hidden; text-overflow: ellipsis; }
tr.run:hover { background: color-mix(in srgb, var(--text) 4%, transparent); }
.mono { font-family: var(--mono); font-size: 12px; }
.empty { color: var(--mute); padding: 6px 0; }
.item.empty { padding: 8px 10px; } .item.empty:hover { background: none; }
.err { color: var(--err); white-space: pre-wrap; }
dialog { border: 1px solid var(--line); border-radius: 14px; background: var(--panel); color: var(--text); width: min(880px, 92vw); padding: 18px; }
dialog::backdrop { background: rgba(0,0,0,.35); }
textarea, pre.log {
  width: 100%; height: 60vh; font-family: var(--mono); font-size: 12.5px; background: var(--bg); color: var(--text);
  border: 1px solid var(--line); border-radius: 8px; padding: 10px; margin: 10px 0; resize: vertical;
  -webkit-user-select: text; user-select: text; overflow: auto; white-space: pre;
}
input { font: inherit; padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--text); width: 100%; margin: 4px 0 10px; }
/* A button with a note beside it; the note drops below when narrow. */
.btnrow { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; }
.row { display: flex; justify-content: flex-end; align-items: center; gap: 8px; }
.welcome { color: var(--mute); margin-top: 18vh; text-align: center; }
.banner { border: 1px solid var(--warn); background: color-mix(in srgb, var(--warn) 10%, transparent); border-radius: 12px; padding: 14px 18px; margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center; gap: 16px; }
.rlist { display: flex; flex-direction: column; gap: 8px; }
.rrow { display: flex; align-items: center; gap: 10px; border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; }
.rrow .grow { flex: 1; min-width: 0; }
.rrow .sub { color: var(--mute); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tag { font-size: 11px; padding: 0 7px; border-radius: 99px; background: color-mix(in srgb, var(--text) 8%, transparent); color: var(--mute); }
.tag.rec { background: var(--accent-soft); color: var(--accent); }
.tag.ok { background: color-mix(in srgb, var(--ok) 15%, transparent); color: var(--ok); }
.tag.warn { background: color-mix(in srgb, var(--warn) 15%, transparent); color: var(--warn); }
.warn { color: var(--warn); font-size: 12px; }
select { font: inherit; padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--text); width: 100%; margin: 4px 0 10px; }
.head .more { font-size: 18px; line-height: 1; padding: 4px 12px; }
.menu { position: fixed; z-index: 10; min-width: 190px; display: flex; flex-direction: column;
  background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 6px; box-shadow: 0 8px 24px rgba(0,0,0,.18); }
.menu[hidden] { display: none; }
.menu button { border: none; background: none; text-align: left; padding: 7px 10px; border-radius: 6px; }
.menu button:hover { background: color-mix(in srgb, var(--text) 7%, transparent); }
.menu button.danger { color: var(--err); }
.menu hr { border: none; border-top: 1px solid var(--line); margin: 4px 2px; }
.task { border: 1px solid var(--accent); border-radius: 12px; padding: 12px 16px; margin-bottom: 16px; }
.task pre { margin: 8px 0 0; max-height: 180px; overflow: auto; font-family: var(--mono); font-size: 11.5px; color: var(--mute); white-space: pre-wrap; -webkit-user-select: text; user-select: text; }
.task.err { border-color: var(--err); }
.spin { display: inline-block; width: 10px; height: 10px; border: 2px solid var(--accent); border-right-color: transparent; border-radius: 50%; animation: spin .8s linear infinite; margin-right: 6px; }
@keyframes spin { to { transform: rotate(360deg); } }
.sechead { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.sechead h2 { margin: 0; }
.form { display: grid; grid-template-columns: 120px 1fr; gap: 10px 14px; align-items: center; margin: 12px 0; }
.form label { color: var(--mute); }
.form input, .form select { margin: 0; }
.tools { display: flex; gap: 6px; flex-wrap: wrap; margin: 10px 0; }
.tools button { font-size: 12.5px; padding: 3px 10px; }
.inline { display: flex; gap: 8px; align-items: center; }
.inline input[type=checkbox] { width: auto; margin: 0; }
.combo .cq { margin: 0; }
.clist { margin-top: 4px; max-height: 240px; overflow: auto; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); }
.copt { display: flex; justify-content: space-between; gap: 12px; padding: 5px 10px; cursor: default; }
.copt code { color: var(--mute); font-family: var(--mono); font-size: 12px; }
.copt.cur { font-weight: 600; }
.copt.on { background: var(--accent-soft); }
.clist .empty { padding: 8px 10px; }
.fsets { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 14px; }
.fsets label { display: flex; gap: 6px; align-items: flex-start; color: var(--text); font-size: 13px; }
.fsets input { width: auto; margin: 3px 0 0; }
.fsets small { color: var(--mute); display: block; }
.fsets small.warn { color: var(--err); }
.tabs { display: flex; gap: 4px; margin: -8px 0 16px; border-bottom: 1px solid var(--line); }
.tabs button { border: none; background: none; border-radius: 0; padding: 8px 14px; color: var(--mute); border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tabs button.on { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }
table.about { border-collapse: collapse; -webkit-user-select: text; user-select: text; }
table.about th { text-align: left; font-weight: 400; color: var(--mute); padding: 4px 24px 4px 0; white-space: nowrap; vertical-align: top; }
table.about td { padding: 4px 0; word-break: break-all; }
table.about td button { padding: 2px 10px; margin-left: 8px; font-size: 12px; }
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.radios { display: flex; flex-direction: column; gap: 8px; margin: 6px 0; }
.radios label { display: flex; gap: 8px; align-items: flex-start; }
.radios input { width: auto; margin: 3px 0 0; }
.radios small { color: var(--mute); display: block; }
.vlist { max-height: 52vh; overflow: auto; border: 1px solid var(--line); border-radius: 8px; margin: 8px 0; }
.vlist summary { position: sticky; top: 0; z-index: 1; padding: 6px 10px; font-size: 12px; font-weight: 600; color: var(--mute);
  background: var(--panel); border-bottom: 1px solid var(--line); cursor: default; user-select: none; }
.vrow { display: flex; gap: 10px; align-items: baseline; padding: 4px 10px; color: var(--text); font-size: 13px; }
.vrow:hover { background: color-mix(in srgb, var(--text) 5%, transparent); }
.vrow input { width: auto; margin: 0; align-self: center; }
.vrow code { font-family: var(--mono); font-size: 12px; min-width: 140px; }
.vrow .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.vrow small { color: var(--mute); white-space: nowrap; }
.vrow small.ok { color: var(--ok); }
.plist { max-height: 46vh; overflow: auto; display: flex; flex-direction: column; gap: 6px; margin: 10px 0; }
.prow { display: flex; gap: 10px; align-items: center; border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; }
.prow img, .prow .ph { width: 28px; height: 28px; object-fit: contain; flex: none; }
.prow .grow { flex: 1; min-width: 0; } .prow .sub { color: var(--mute); font-size: 11.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.crumb { font-family: var(--mono); font-size: 12px; color: var(--mute); }
#toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); max-width: 80vw; background: var(--text); color: var(--bg);
  padding: 8px 16px; border-radius: 10px; font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; white-space: pre-wrap; z-index: 10; }
#toast.on { opacity: .94; } #toast.bad { background: var(--err); color: #fff; }
#dlg2 { width: min(460px, 86vw); }
</style>
</head>
<body>
<aside>
  <div class="brand"><img src="logo.svg" alt="">Cellar</div>
  <div class="list" id="list"></div>
  <div class="sys" id="sys"></div>
</aside>
<main id="main"><div class="welcome">…</div></main>

<dialog id="dlg"></dialog>
<dialog id="dlg2"></dialog>
<div id="toast"></div>
<div class="menu" id="ctx" role="menu" hidden></div>

<script type="module">
import { Call } from "/wails/runtime.js";
import { t, setLang, LANG_NAMES } from "./i18n.js";
const S = "github.com/jing2uo/cellar/internal/gui.Service.";
const call = (m, ...a) => Call.ByName(S + m, ...a);
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const stateText = (state) => ({
  applied: t("已就绪"), changed: t("配置已改"), new: t("待应用"), error: t("错误"),
}[state]);

let env, prefixes = [], sel = null;
const SETTINGS = "\u0000settings";
// setTab is the settings page's tab: general, fonts, runner or import.
let setTab = "general";
function openSettings(tab) { sel = SETTINGS; setTab = tab; renderList(); renderMain(); }
let bottles = [], cellars = [];

// load refreshes the data; it re-renders only when something changed and no
// dialog is open, so a refresh on window focus never swaps the page out from
// under the click that focused it.
let lastSig = "";
// In-page replacements for alert/confirm/prompt: WebKitGTK inside Wails is
// not guaranteed to show the native ones, and prompt() then returns null.
let toastTimer;
function toast(msg, bad = false) {
  const el = $("#toast"); el.textContent = msg; el.className = "on" + (bad ? " bad" : "");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.className = "", bad ? 6000 : 2500);
}
const fail = (e) => toast(String((e && e.message) || e), true);
function ask(title, value = null) {
  return new Promise((resolve) => {
    const d = $("#dlg2");
    d.innerHTML = `<b>${esc(title)}</b>${value !== null ? `<input id="v" value="${esc(value)}">` : ""}
      <div class="row"><button id="no">${t("取消")}</button><button id="ok" class="primary">${t("确定")}</button></div>`;
    const done = (v) => { d.close(); resolve(v); };
    d.querySelector("#no").onclick = () => done(null);
    d.querySelector("#ok").onclick = () => done(value !== null ? d.querySelector("#v").value.trim() : true);
    if (value !== null) d.querySelector("#v").onkeydown = (ev) => { if (ev.key === "Enter") d.querySelector("#ok").click(); };
    d.showModal();
    if (value !== null) d.querySelector("#v").select();
  });
}

async function load(force = true) {
  const [e, ps, bs, cs] = await Promise.all([call("Env"), call("Prefixes"), call("Bottles"), call("CellarPrefixes")]);
  const sig = JSON.stringify([e, ps, bs, cs, sel]);
  if (!force && (sig === lastSig || $("#dlg").open)) return;
  lastSig = sig;
  env = e; prefixes = ps; bottles = bs; cellars = cs;
  setLang(env.lang);
  applyTheme(env.theme);
  if (!sel && location.hash.length > 1) { sel = decodeURIComponent(location.hash.slice(1)); if (sel === "runners") { sel = SETTINGS; setTab = "runner"; } }
  if (!sel && prefixes.length) sel = prefixes[0].name;
  renderList();
  renderMain();
}

// applyTheme sets light or dark, or "" to follow the system.
function applyTheme(theme) {
  if (theme) document.documentElement.dataset.theme = theme;
  else delete document.documentElement.dataset.theme;
}

function renderList() {
  const local = prefixes.filter((p) => p.source === "local");
  $("#list").innerHTML = `<div class="group gh"><span>${t("Prefix 列表")}</span><button id="new" class="gadd" title="${t("新建 prefix")}"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></button></div>` +
    (local.map((p) => `<div class="item ${p.name === sel ? "sel" : ""}" data-n="${esc(p.name)}">
      <span>${esc(p.name)}</span><small class="s-${p.state}">●</small></div>`).join("") || `<div class="empty item">${t("还没有 prefix")}</div>`);
  $("#sys").innerHTML = `<div class="item ${sel === SETTINGS ? "sel" : ""}" id="settingsitem"><span class="withico"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>${t("设置")}</span></div>`;
  document.querySelectorAll(".item[data-n]").forEach((el) => {
    el.onclick = () => { if (dragged) return; sel = el.dataset.n; renderList(); renderMain(); };
    el.onpointerdown = (ev) => dragItem(el, ev);
  });
  $("#new").onclick = newPrefix;
  $("#settingsitem").onclick = () => { sel = SETTINGS; renderList(); renderMain(); };
}

// dragItem reorders the prefix list by dragging an item, with pointer
// events: WebKitGTK under Wails does not reliably deliver HTML5 drag and
// drop. A move under a few pixels is still a click.
let dragged = false;
function dragItem(el, ev) {
  if (ev.button !== 0) return;
  const list = $("#list"), x0 = ev.clientX, y0 = ev.clientY;
  let slot = null, dx = 0, dy = 0;
  // lift takes the item out of the list to follow the pointer, leaving a
  // slot where it will land.
  const lift = () => {
    const r = el.getBoundingClientRect();
    dx = x0 - r.left; dy = y0 - r.top;
    slot = document.createElement("div");
    slot.className = "item slot"; slot.style.height = r.height + "px";
    list.insertBefore(slot, el);
    Object.assign(el.style, { width: r.width + "px", left: r.left + "px", top: r.top + "px" });
    el.classList.add("dragging");
  };
  // place moves the slot, sliding the items it passes into their new places.
  const place = (y) => {
    const items = [...list.querySelectorAll(".item[data-n]:not(.dragging)")];
    const after = items.find((x) => { const r = x.getBoundingClientRect(); return y < r.top + r.height / 2; }) || null;
    if (after === slot.nextElementSibling) return;
    const before = new Map(items.map((x) => [x, x.getBoundingClientRect().top]));
    list.insertBefore(slot, after);
    for (const [x, top] of before) {
      const d = top - x.getBoundingClientRect().top; if (!d) continue;
      x.classList.remove("shift"); x.style.transform = `translateY(${d}px)`;
      void x.offsetWidth; x.classList.add("shift"); x.style.transform = "";
    }
  };
  const move = (e) => {
    if (!slot) { if (Math.hypot(e.clientX - x0, e.clientY - y0) < 5) return; lift(); }
    el.style.left = e.clientX - dx + "px"; el.style.top = e.clientY - dy + "px";
    place(e.clientY);
  };
  const up = async () => {
    removeEventListener("pointermove", move);
    removeEventListener("pointerup", up);
    removeEventListener("pointercancel", up);
    if (!slot) return;
    list.replaceChild(el, slot);
    el.classList.remove("dragging"); el.removeAttribute("style");
    list.querySelectorAll(".shift").forEach((x) => x.classList.remove("shift"));
    // The click that ends the drag must not select the item.
    dragged = true; setTimeout(() => dragged = false);
    const names = [...list.querySelectorAll(".item[data-n]")].map((x) => x.dataset.n);
    if (names.join("\0") === prefixes.filter((p) => p.source === "local").map((p) => p.name).join("\0")) return;
    prefixes.sort((a, b) => names.indexOf(a.name) - names.indexOf(b.name));
    try { await call("SetPrefixOrder", names); } catch (e) { fail(e); }
  };
  addEventListener("pointermove", move);
  addEventListener("pointerup", up);
  addEventListener("pointercancel", up);
}

// ── background tasks ──────────────────────────────────────────────────────
// applyNow starts applying before the page reloads, so the reload sees the
// task and does not offer the changes it is applying.
// Steps that run wine tools (wineboot, winetricks, an installer) need the
// prefix to themselves; the rest goes in live while programs run.
async function applyNow(name) {
  let id;
  try {
    const busy = await call("ApplyBusy", name);
    if (busy.length) {
      const progs = [...new Set(busy.filter((p) => !p.system).map((p) => p.name))];
      if (!await ask(progs.length ? t("这些更改要在程序都结束后才能应用。结束 {0} 并应用？", progs.join(t("、")))
        : t("这些更改要在 Wine 后台进程结束后才能应用。结束并应用？"))) return;
      await call("Kill", name);
    }
    id = await call("ApplyTask", name);
  } catch (e) { fail(e); }
  await load();
  if (id) watchTask(name, id);
}

async function startTask(name, start) {
  try { const id = await start(); if (id) watchTask(name, id); } catch (e) { fail(e); }
}

let watching = null;
async function watchTask(name, id) {
  watching = id;
  for (;;) {
    if (watching !== id || sel !== name || !$("#task")) return;
    let task;
    try { task = await call("Task", id); } catch { return; }
    // Update the panel in place: rebuilding it every poll would reset the
    // log's scroll. The log follows new output only while scrolled to the end.
    let pre = $("#task pre");
    if (!pre || pre.dataset.task !== id) {
      $("#task").innerHTML = `<div class="task"><b></b><div class="err" hidden></div><pre data-task="${esc(id)}"></pre></div>`;
      pre = $("#task pre");
    }
    const box = $("#task .task");
    box.classList.toggle("err", !!task.error);
    box.querySelector("b").innerHTML = task.done ? esc(task.error ? t("失败：{0}", task.title) : t("完成：{0}", task.title)) : `<span class="spin"></span>${esc(task.title)}`;
    const errEl = box.querySelector("div.err");
    errEl.hidden = !task.error; errEl.textContent = task.error ? task.error.split("\n")[0] : "";
    const text = task.lines.slice(-200).join("\n");
    if (pre.textContent !== text) {
      const atEnd = pre.scrollHeight - pre.scrollTop - pre.clientHeight < 8;
      pre.textContent = text;
      if (atEnd) pre.scrollTop = pre.scrollHeight;
    }
    if (task.done) {
      if (task.error) { // keep the panel up so the error and log stay readable
        toast(t("失败：{0}", task.title), true);
        prefixes = await call("Prefixes"); renderList(); showPlan(name);
      } else {
        toast(t("完成：{0}", task.title));
        await load(true);
      }
      return;
    }
    await new Promise((r) => setTimeout(r, 700));
  }
}

    try { task = await call("Task", id); } catch { return; }
    const el = $("#fonttask");
    if (!el || !onTab("fonts")) return;
    el.innerHTML = `${task.done ? "" : `<span class="spin"></span>`}${esc(task.title)}: ${esc(task.lines.at(-1) || t("开始…"))}`;
    if (task.done) {
      if (task.error) { el.innerHTML = `<span class="err">${esc(task.error)}</span>`; toast(t("下载失败"), true); }
      else toast(t("完成：{0}", task.title));
      return setTimeout(() => onTab("fonts") && renderFonts(), task.error ? 3000 : 0);
    }
    await new Promise((r) => setTimeout(r, 600));
  }
}

// showPlan shows a notice only when the prefix is behind its cellar.toml:
// saves in the GUI apply at once, so this is for changes made elsewhere
// (the CLI, an editor, a new runner) or an apply that partly failed.
async function showPlan(name) {
  const set = (html) => { if ($("#plan") && sel === name) $("#plan").innerHTML = html; };
  let pl;
  try {
    if (await call("Running", name)) return set("");
    pl = await call("Plan", name);
  } catch (e) { return set(`<section><div class="err">${esc(e.message || e)}</div></section>`); }
  const n = (pl.changes || []).length;
  const warn = (pl.warnings || []).map((w) => `<div class="err">⚠ ${esc(w)}</div>`).join("");
  if (!n && !warn) return set("");
  set(`<section>${n ? `<div class="sechead"><h2>${t("配置有 {0} 项更改未生效", n)}</h2>
      <div class="actions"><button id="planview">${t("查看")}</button><button id="apply" class="primary">${t("应用#apply")}</button></div></div>` : ""}${warn}</section>`);
  if (!n) return;
  const apply = () => applyNow(name);
  $("#apply").onclick = apply;
  // Edits to cellar.toml can be undone; changes a new Cellar or Wine brings
  // to the same file can only be applied.
  $("#planview").onclick = async () => {
    const edited = await call("ConfigEdited", name);
    dialog(`<b>${t("{0}：未生效的更改", esc(name))}</b><ul class="changes">${pl.changes.map((c) =>
        `<li><span class="op op-${c.op}">${c.op}</span>${esc(fmt(c))}</li>`).join("")}</ul>
      ${edited ? "" : `<div class="meta">${t("这些更改来自 Cellar 或 Wine 的更新，只能应用。")}</div>`}
      <div class="row">${edited ? `<button id="u">${t("撤销修改")}</button>` : ""}<span style="flex:1"></span>
        <button id="c">${t("关闭")}</button><button id="a" class="primary">${t("应用#apply")}</button></div>`, (d) => {
      d.querySelector("#c").onclick = () => d.close();
      d.querySelector("#a").onclick = () => { d.close(); apply(); };
      if (edited) d.querySelector("#u").onclick = async () => {
        if (!await ask(t("撤销修改？cellar.toml 会恢复到上次应用时的内容。"))) return;
        try { await call("RevertConfig", name); d.close(); toast(t("已撤销")); } catch (e) { fail(e); }
        await load();
      };
    });
  };
}

function fmt(c) {
  if (c.op === "init" || c.op === "update") return c.value;
  if (c.op === "set") return `${c.key}\\${c.name} = ${c.value}`;
  if (c.op === "delete") return `${c.key}\\${c.name}`;
  if (c.op === "link" || c.op === "unlink") return `${c.name} → ${c.value}`;
  if (c.op === "download") return `${c.name} ← ${c.value}`;
  if (c.op === "install") return c.value ? `${c.name} ${c.value}` : `winetricks ${c.name}`;
  return `${c.name}: → ${c.value}`;
}

// showRuns draws the prefix's finished runs. A run is recorded only when it
// exits, so the open prefix's list is polled (runsPoll) and redrawn only
// when a run came or went.
async function showRuns(name) {
  const runs = await call("Runs", name);
  const el = $("#runs"), key = runs.map((r) => r.id).join();
  if (!el || sel !== name || el.dataset.key === key) return;
  el.outerHTML = `<div id="runs" data-key="${esc(key)}">${runs.length ? `<table>${runs.map((r) => `
    <tr class="run" data-id="${esc(r.id)}"><td class="mono">${esc(r.id)}</td><td>${esc(r.app || "—")}</td>
    <td class="${r.exit_code ? "s-error" : "s-applied"}">${t("退出码 {0}", r.exit_code)}</td><td>${r.seconds.toFixed(1)}s</td>
    <td class="mono cmd" title="${esc(r.argv.slice(1).join(" "))}">${esc(r.argv.slice(1).join(" "))}</td></tr>`).join("")}</table>` : `<div class="empty">${t("暂无运行记录")}</div>`}</div>`;
  document.querySelectorAll("tr.run").forEach((tr) => tr.onclick = () => showLog(name, tr.dataset.id));
  const b = $("#clearruns");
  b.hidden = !runs.length;
  b.onclick = async () => {
    try { await call("ClearRuns", name); } catch (e) { fail(e); }
    showRuns(name);
  };
}

// Region and font sets: the locale sets the Windows UI language and code
// page; each font set maps one script's Windows fonts to host fonts.
const localeName = (id) => (env.locales.find((l) => l.id === id) || { name: id }).name;
const fontSetName = (id) => t((env.font_sets.find((f) => f.id === id) || { name: id }).name);
const corePackName = (pack) => pack === "mscore" ? t("微软") : "Liberation";
// localeField is the region picker: a box that filters the list by code or
// name as you type. It starts on the prefix's locale, else the host's,
// marked （系统）; whatever is picked is written out, so what it shows is
// what the prefix gets. A locale set by hand outside the list stays.
function localeField(value) {
  value = value || env.host_locale || "en_US";
  return `<div class="combo" id="loc" data-value="${esc(value)}"><input class="cq" value="${esc(localeLabel(value))}"
    placeholder="${t("输入代码或名称过滤，如 sv、svenska")}" autocomplete="off" spellcheck="false"><div class="clist" tabindex="-1" hidden></div></div>`;
}
function localeLabel(id) {
  const l = env.locales.find((l) => l.id === id);
  return `${l ? l.name + " " : ""}${id}${id === env.host_locale ? t("（系统）") : ""}`;
}
// fontField lists the sets with what each would use here: the font found
// (host, runtime or library), the winetricks verb installed instead, or a
// pointer to the settings page to download it.
// core, when given (a prefix's [fonts] core, "" following cellar's
// settings, whose choice is globalCore), adds the English core fonts
// picker beside the English set.
const fontField = (sets, core, globalCore) => `<div class="fsets">${env.font_sets.map((f) =>
  `<label><input type="checkbox" value="${f.id}" ${sets.includes(f.id) ? "checked" : ""}><span>${esc(t(f.name))}${f.id === "core" && core !== undefined ? coreSelect(core, globalCore) : ""}<small>${esc(t(f.note))}</small><small data-fs="${f.id}">${t("查找字体…")}</small></span></label>`).join("")}</div>`;
const coreSelect = (core, globalCore) => `<select id="corefonts" style="width:auto;margin:0 0 0 8px;padding:1px 6px">
    <option value="" ${!core ? "selected" : ""}>${t("跟随全局（{0}）", corePackName(globalCore === "microsoft" ? "mscore" : "liberation"))}</option>
    <option value="microsoft" ${core === "microsoft" ? "selected" : ""}>${t("微软核心字体")}</option>
    <option value="liberation" ${core === "liberation" ? "selected" : ""}>Liberation</option></select>`;
const readCore = (d) => d.querySelector("#corefonts")?.value || "";
const mb = (n) => `${Math.max(1, Math.round(n / 1048576))} MB`;
// wireFonts makes "all" carry the sets it includes: ticked, it ticks and
// locks them.
function wireFonts(d) {
  const all = env.font_sets.find((f) => f.includes);
  const boxes = (ids) => ids.map((id) => d.querySelector(`.fsets input[value="${id}"]`)).filter(Boolean);
  const pick = d.querySelector("#corefonts");
  const sync = () => {
    const on = d.querySelector(`.fsets input[value="${all.id}"]`).checked;
    boxes(all.includes).forEach((b) => { if (on) b.checked = true; b.disabled = on; });
    if (pick) pick.disabled = !d.querySelector('.fsets input[value="core"]').checked;
  };
  d.querySelector(`.fsets input[value="${all.id}"]`).addEventListener("change", sync);
  d.querySelector('.fsets input[value="core"]')?.addEventListener("change", sync);
  if (pick) pick.onchange = () => showFontStatus(d);
  sync();
}
async function showFontStatus(d) {
  let st;
  try { st = await call("FontStatus", readCore(d)); } catch { return; }
  for (const s of st) {
    const el = d.querySelector(`[data-fs="${s.id}"]`);
    if (!el) continue;
    el.classList.remove("warn");
    const where = { host: t("（本机）"), runtime: t("（Cellar 自带）"), library: t("（已下载）") }[s.source];
    if (s.source === "scripts") {
      el.textContent = s.have === s.total ? t("{0} 种文字里 {1} 种有字体", s.total, s.have) : t("{0} 种文字里 {1} 种有字体，其余可在 设置 → 字体 下载", s.total, s.have);
      continue;
    }
    if (s.family) { el.textContent = `→ ${s.family}${where || ""}`; continue; }
    // Missing: the set's fonts have to be downloaded into the library.
    el.innerHTML = "⚠ " + t("没有可用字体，去 {0} 下载", `<a href="#" data-goset>${t("设置 → 字体")}</a>`);
    el.classList.add("warn");
    el.querySelector("[data-goset]").onclick = (ev) => { ev.preventDefault(); d.close(); openSettings("fonts"); };
  }
}
// wireLocale runs the picker; onPick gets the locale picked.
function wireLocale(d, onPick) {
  const box = d.querySelector("#loc"), q = box.querySelector(".cq"), list = box.querySelector(".clist");
  let shown = [], at = -1;
  const pick = (id) => {
    box.dataset.value = id; q.value = localeLabel(id); list.hidden = true;
    if (onPick) onPick(env.locales.find((l) => l.id === id));
  };
  const render = () => {
    const f = q.value.trim().toLowerCase();
    const cur = box.dataset.value;
    let all = env.locales;
    if (!all.some((l) => l.id === cur)) all = [{ id: cur, name: t("（当前）") }, ...all];
    const host = all.find((l) => l.id === env.host_locale);
    if (f) shown = all.filter((l) => l.id.toLowerCase().includes(f) || l.name.toLowerCase().includes(f));
    else shown = [...(host ? [host] : []), ...all.filter((l) => l.common && l !== host), ...all.filter((l) => !l.common && l !== host)];
    // Unfiltered, Enter keeps the current choice; filtered, it takes the top match.
    at = shown.length ? Math.max(0, f ? 0 : shown.findIndex((l) => l.id === cur)) : -1;
    list.innerHTML = shown.length ? shown.map((l, i) => `<div class="copt${i === at ? " on" : ""}${l.id === cur ? " cur" : ""}" data-i="${i}">
      <span>${esc(l.name)}</span><code>${esc(l.id)}${l.id === env.host_locale ? t("（系统）") : ""}</code></div>`).join("") : `<div class="empty">${t("没有匹配的区域")}</div>`;
    list.hidden = false;
  };
  const move = (n) => {
    if (!shown.length) return;
    at = (at + n + shown.length) % shown.length;
    list.querySelectorAll(".copt").forEach((e, i) => e.classList.toggle("on", i === at));
    list.querySelector(".copt.on").scrollIntoView({ block: "nearest" });
  };
  // Focus empties the box (the current choice stays as its placeholder), so
  // typing filters at once; leaving without a pick puts the choice back.
  // The list takes focus too (dragging its scrollbar), so only focus leaving
  // the whole picker closes it.
  const close = () => { list.hidden = true; q.value = localeLabel(box.dataset.value); q.placeholder = t("输入代码或名称过滤，如 sv、svenska"); };
  q.onfocus = (ev) => {
    if (box.contains(ev.relatedTarget)) return; // back from the list
    q.placeholder = q.value; q.value = ""; render();
    list.querySelector(".copt.cur")?.scrollIntoView({ block: "nearest" });
  };
  box.addEventListener("focusout", (ev) => { if (!box.contains(ev.relatedTarget)) close(); });
  q.oninput = render;
  q.onkeydown = (ev) => {
    if (ev.key === "ArrowDown") { ev.preventDefault(); move(1); }
    else if (ev.key === "ArrowUp") { ev.preventDefault(); move(-1); }
    else if (ev.key === "Enter") { ev.preventDefault(); if (at >= 0) pick(shown[at].id); q.blur(); }
    else if (ev.key === "Escape") { ev.preventDefault(); ev.stopPropagation(); q.blur(); }
  };
  // An option picks on mousedown; elsewhere (the scrollbar) the list keeps
  // focus while dragging and hands it back to the box after.
  list.onmousedown = (ev) => { const o = ev.target.closest(".copt"); if (o) { ev.preventDefault(); pick(shown[+o.dataset.i].id); q.blur(); } };
  list.onmouseup = () => { if (!list.hidden) q.focus(); };
}
const readLocale = (d) => d.querySelector("#loc").dataset.value;
// readFonts is what the boxes say: "all" alone stands for what it includes.
const readFonts = (d) => {
  const on = [...d.querySelectorAll(".fsets input:checked")].map((i) => i.value);
  const all = env.font_sets.find((f) => f.includes);
  return on.includes(all.id) ? [all.id] : on;
};
const LOCALE_NOTE = () => t("Windows 界面语言和编码，老软件乱码时改它");
const FONTS_NOTE = () => t("界面缺的字用 Noto 字体补齐，在 设置 → 字体 里管理");
const WINVER = [["win11", "Windows 11"], ["win10", "Windows 10"], ["win81", "Windows 8.1"], ["win7", "Windows 7"], ["winxp", "Windows XP"]];
const DPIS = () => [[0, t("自动（跟随系统 Xft.dpi）")], [96, "100%"], [120, "125%"], [144, "150%"], [168, "175%"], [192, "200%"]];

// sizeField offers the virtual desktop sizes Wine takes on this screen, and
// any other size typed in (cellar makes Wine take that one too).
function sizeField(cur, ds) {
  const def = ds.sizes.includes("1920x1080") ? "1920x1080" : ds.screen || ds.sizes[ds.sizes.length - 1];
  const custom = !!cur && !ds.sizes.includes(cur);
  const pick = custom ? "custom" : cur || def;
  return `<select id="vdsize" style="width:auto;margin:0">${ds.sizes.map((v) => `<option value="${v}" ${v === pick ? "selected" : ""}>${v}${v === ds.screen ? t("（屏幕大小）") : ""}</option>`).join("")}
      <option value="custom" ${custom ? "selected" : ""}>${t("自定义")}</option></select>
    <input id="vdres" placeholder="1600x1000" value="${esc(custom ? cur : "")}" style="width:120px;margin:0" ${custom ? "" : "hidden"}>`;
}
function wireSize(d) {
  const on = d.querySelector("#vd"), size = d.querySelector("#vdsize"), res = d.querySelector("#vdres");
  const sync = () => { size.disabled = res.disabled = !on.checked; res.hidden = size.value !== "custom"; };
  on.onchange = size.onchange = () => { sync(); if (!res.hidden) res.focus(); };
  sync();
}
// readSize is "" (off), the size, or throws on a custom one that is no WxH.
function readSize(d) {
  if (!d.querySelector("#vd").checked) return "";
  const v = d.querySelector("#vdsize").value;
  if (v !== "custom") return v;
  const c = d.querySelector("#vdres").value.trim().toLowerCase();
  if (!/^[1-9]\d*x[1-9]\d*$/.test(c)) throw new Error(t("虚拟桌面大小要写成 宽x高，比如 1600x1000"));
  return c;
}

async function settings(name) {
  const [st, ds, pr] = await Promise.all([call("Settings", name), call("DesktopSizes"), call("Prefs")]);
  dialog(`<b>${t("{0} 设置", esc(name))}</b>
    <div class="form">
      <label>${t("Windows 版本")}</label><select id="wv"><option value="">${t("默认（Windows 10）")}</option>${WINVER.map(([v, label]) => `<option value="${v}" ${st.windows_version === v ? "selected" : ""}>${label}</option>`).join("")}</select>
      <label>${t("虚拟桌面")}</label><div class="inline"><input type="checkbox" id="vd" ${st.virtual_desktop ? "checked" : ""}>
        ${sizeField(st.virtual_desktop, ds)}<small class="meta">${t("程序都开在一个 Wine 桌面窗口里")}</small></div>
      <label>${t("缩放（DPI）")}</label><select id="dpi">${DPIS().map(([v, label]) => `<option value="${v}" ${st.dpi === v ? "selected" : ""}>${label}${v ? t("（{0}）", v) : ""}</option>`).join("")}
        ${st.dpi && !DPIS().some(([v]) => v === st.dpi) ? `<option value="${st.dpi}" selected>${st.dpi}</option>` : ""}</select>
      <label>${t("区域")}</label><div>${localeField(st.locale)}<small class="meta">${LOCALE_NOTE()}</small></div>
      <label>${t("字体")}</label><div>${fontField(st.font_sets, st.core_fonts || "", pr.fonts.core)}<small class="meta">${FONTS_NOTE()}</small></div>
    </div>
    <div id="e" class="err"></div>
    <div class="row"><button id="c">${t("取消")}</button><button id="s" class="primary">${t("保存并应用")}</button></div>`, (d) => {
    wireLocale(d);
    wireFonts(d);
    wireSize(d);
    showFontStatus(d);
    d.querySelector("#c").onclick = () => d.close();
    d.querySelector("#s").onclick = async () => {
      try {
        const next = { ...st, locale: readLocale(d), font_sets: readFonts(d), core_fonts: readCore(d), windows_version: d.querySelector("#wv").value,
          virtual_desktop: readSize(d), dpi: +d.querySelector("#dpi").value };
        await call("SaveSettings", name, next); d.close(); await applyNow(name);
      }
      catch (e) { d.querySelector("#e").textContent = e.message || e; }
    };
  });
}

// deps picks the prefix's winetricks verbs from everything winetricks
// offers. Unticking only stops asking for one: winetricks cannot remove
// what it installed.
const WINETRICKS_URL = "https://github.com/Winetricks/winetricks";
// ── processes ─────────────────────────────────────────────────────────────
// What runs in the prefix, refreshed while the dialog is open. Picked
// processes can be ended, or blocked: their .exe goes into dll_overrides as
// disabled, and Wine refuses to start it again.
const memText = (kb) => kb >= 1024 ? `${Math.round(kb / 1024)} MB` : `${kb} KB`;
function procs(name) {
  const picked = new Set(); // pids
  let list = [], showSys = false, timer, gen = 0, seen = "";
  dialog(`<div class="row" style="justify-content:space-between"><b>${t("{0}：进程管理", esc(name))}</b>
      <label class="inline"><input type="checkbox" id="sys">${t("显示 Wine 系统进程")}</label></div>
    <div class="meta">${t("禁止运行会把程序名写进 DLL 覆盖并设为禁用，Wine 不会再启动它。")}</div>
    <div class="vlist" id="pl"><div class="empty" style="padding:10px">${t("读取中…")}</div></div>
    <div id="bl"></div>
    <div class="row"><span class="meta" id="cnt"></span><span style="flex:1"></span>
      <button id="c">${t("关闭")}</button><button id="blk">${t("禁止运行")}</button><button id="end" class="primary">${t("结束进程")}</button></div>`, (d) => {
    d.addEventListener("close", () => { gen++; clearTimeout(timer); load(); }, { once: true });
    d.querySelector("#c").onclick = () => d.close();
    const chosen = () => list.filter((p) => picked.has(p.pid));
    const sync = () => {
      const s = chosen();
      d.querySelector("#cnt").textContent = s.length ? t("已选 {0} 个", s.length) : "";
      d.querySelector("#end").disabled = !s.length;
      d.querySelector("#blk").disabled = !s.length || s.some((p) => p.system);
    };
    const render = () => {
      const rows = list.filter((p) => showSys || !p.system || picked.has(p.pid));
      d.querySelector("#pl").innerHTML = rows.map((p) => `<label class="vrow"><input type="checkbox" value="${p.pid}" ${picked.has(p.pid) ? "checked" : ""}>
        <code>${esc(p.name)}</code><span class="t">${p.system ? `<small>${t("Wine 系统进程")}</small>` : ""}</span>
        <small>PID ${p.pid}</small><small style="min-width:64px;text-align:right">${memText(p.memory)}</small></label>`).join("")
        || `<div class="empty" style="padding:10px">${t("没有正在运行的程序")}</div>`;
      d.querySelectorAll("#pl input").forEach((i) => i.onchange = () => { i.checked ? picked.add(+i.value) : picked.delete(+i.value); sync(); });
      sync();
    };
    // Re-render only on change, so a refresh never swaps a row out from
    // under a click.
    const poll = async (g) => {
      try {
        list = await call("Processes", name);
        for (const pid of [...picked]) if (!list.some((p) => p.pid === pid)) picked.delete(pid);
        const sig = JSON.stringify([list, showSys]);
        if (g === gen && sig !== seen) { seen = sig; render(); }
      } catch (e) { d.querySelector("#pl").innerHTML = `<div class="err" style="padding:10px">${esc(e.message || e)}</div>`; }
      if (g === gen && d.open) timer = setTimeout(() => poll(g), 2000);
    };
    const refresh = (ms = 0) => { const g = ++gen; clearTimeout(timer); timer = setTimeout(() => poll(g), ms); };
    const blocked = async () => {
      let bl = [];
      try { bl = await call("Blocked", name); } catch (e) { fail(e); }
      d.querySelector("#bl").innerHTML = bl.length ? `<div class="meta" style="margin:4px 0 10px;gap:6px">${t("已禁止运行：")}${bl.map((n) =>
        `<span class="tag">${esc(n)} <a href="#" data-ub="${esc(n)}" title="${t("允许运行")}">×</a></span>`).join("")}</div>` : "";
      d.querySelectorAll("[data-ub]").forEach((a) => a.onclick = async (ev) => {
        ev.preventDefault();
        try { await call("Block", name, [a.dataset.ub], false); toast(t("已允许 {0} 运行", a.dataset.ub)); } catch (e) { fail(e); }
        blocked();
      });
    };
    d.querySelector("#sys").onchange = (ev) => { showSys = ev.target.checked; seen = ""; render(); };
    d.querySelector("#end").onclick = async () => {
      const s = chosen();
      if (s.some((p) => p.system) && !await ask(t("结束 Wine 系统进程可能让这个 prefix 里的程序全部退出。继续？"))) return;
      try { await call("EndProcesses", name, s.map((p) => p.pid)); } catch (e) { fail(e); }
      picked.clear(); refresh(500); refreshRuns(name, 1500);
    };
    d.querySelector("#blk").onclick = async () => {
      const s = chosen();
      const names = [...new Set(s.map((p) => p.name.toLowerCase()))];
      if (!await ask(t("禁止 {0} 运行？正在运行的会被结束，以后也不会再启动。可以在这里恢复。", names.join(t("、"))))) return;
      try { await call("Block", name, names, true); toast(t("已禁止 {0}", names.join(t("、")))); } catch (e) { fail(e); }
      picked.clear(); refresh(500); blocked();
    };
    refresh(); blocked();
  });
}

async function deps(name) {
  dialog(`<b>${t("{0} 的依赖", esc(name))}</b>
    <div class="meta">${t("用 winetricks 安装，已装的会跳过，装上后无法卸载。说明见 {0}。", `<a href="#" id="wtl">winetricks</a>`)}</div>
    <input id="q" placeholder="${t("搜索 verb 或说明")}" autofocus autocomplete="off" spellcheck="false">
    <div class="vlist" id="vl"><div class="empty" style="padding:10px">${t("读取 winetricks 列表…")}</div></div>
    <input id="extra" placeholder="${t("列表里没有的 verb，空格分隔")}">
    <div id="e" class="err"></div>
    <div class="row"><span class="meta" id="cnt"></span><span style="flex:1"></span><button id="c">${t("取消")}</button><button id="s" class="primary">${t("保存并应用")}</button></div>`, async (d) => {
    d.querySelector("#c").onclick = () => d.close();
    d.querySelector("#wtl").onclick = (ev) => { ev.preventDefault(); call("OpenURL", WINETRICKS_URL).catch(fail); };
    let st;
    try { st = await call("Dependencies", name); }
    catch (e) { d.querySelector("#vl").innerHTML = `<div class="err" style="padding:10px">${esc(e.message || e)}</div>`; return; }
    const known = new Set(st.verbs.map((v) => v.verb));
    const want = new Set(st.want.filter((v) => known.has(v)));
    d.querySelector("#extra").value = st.want.filter((v) => !known.has(v)).join(" ");
    const done = new Set(st.installed);
    const byVerb = Object.fromEntries(st.verbs.map((v) => [v.verb, v]));
    const row = (verb, text, by) => `<label class="vrow"><input type="checkbox" value="${esc(verb)}" ${want.has(verb) ? "checked" : ""}>
      <code>${esc(verb)}</code><span class="t" title="${esc(text)}">${esc(text)}</span>
      ${done.has(verb) ? `<small class="ok">${t("已安装")}</small>` : by ? `<small>${esc(by)}</small>` : ""}</label>`;
    // Groups fold; the long lists start folded. A search opens every group
    // with a match, and folding while searching is not remembered.
    const folded = new Set(["dlls", "fonts"]);
    let q = "";
    const group = (key, title, rows) => rows.length
      ? `<details data-g="${key}" ${q || !folded.has(key) ? "open" : ""}><summary>${title}${t("（{0}）", rows.length)}</summary>${rows.join("")}</details>` : "";
    d.querySelector("#vl").addEventListener("toggle", (ev) => {
      if (q) return;
      const g = ev.target.dataset.g;
      ev.target.open ? folded.delete(g) : folded.add(g);
    }, true);
    const render = () => {
      q = d.querySelector("#q").value.trim().toLowerCase();
      const hit = (...xs) => !q || xs.some((x) => (x || "").toLowerCase().includes(q));
      const com = st.common.filter((c) => hit(c.verb, c.note, byVerb[c.verb]?.title))
        .map((c) => row(c.verb, c.note + (c.slow ? t("（慢）") : ""), ""));
      const list = (cat) => st.verbs.filter((v) => v.category === cat && hit(v.verb, v.title, v.by)).map((v) => row(v.verb, v.title, v.by));
      const html = (want.size && !q ? group("want", t("已选"), [...want].map((v) => row(v, byVerb[v].title, byVerb[v].by))) : "") +
        group("common", t("常用"), com) + group("dlls", t("DLL 与运行库"), list("dlls")) + group("fonts", t("字体"), list("fonts"));
      d.querySelector("#vl").innerHTML = html || `<div class="empty" style="padding:10px">${t("没有匹配的 verb")}</div>`;
      d.querySelector("#cnt").textContent = t("已选 {0} 个", want.size);
    };
    // A verb shows in more than one group: its boxes move together.
    d.querySelector("#vl").addEventListener("change", (ev) => {
      const v = ev.target.value;
      ev.target.checked ? want.add(v) : want.delete(v);
      d.querySelectorAll(`.vrow input[value="${CSS.escape(v)}"]`).forEach((i) => i.checked = ev.target.checked);
      d.querySelector("#cnt").textContent = t("已选 {0} 个", want.size);
    });
    d.querySelector("#q").oninput = render;
    render();
    d.querySelector("#s").onclick = async () => {
      const list = [...want, ...d.querySelector("#extra").value.split(/\s+/).filter(Boolean)];
      try { await call("SaveDependencies", name, [...new Set(list)]); d.close(); await applyNow(name); }
      catch (e) { d.querySelector("#e").textContent = e.message || e; }
    };
  });
}

async function install(name) {
  const run = await call("Running", name);
  if (run) { toast(t("这个 prefix 有任务在跑，请稍后再试。"), true); return; }
  let path;
  try { path = await call("PickInstaller"); } catch (e) { return; }
  if (!path) return;
  try { await call("RunInstaller", name, path); } catch (e) { fail(e); return; }
  $("#task").innerHTML = `<div class="task"><b>${t("程序已启动")}</b><div class="meta">${esc(path)}<br>${t("安装完成后，点“添加应用”选择主程序。")}</div></div>`;
  setTimeout(() => showRuns(name), 3000);
}

async function addApp(name) {
  dialog(`<b>${t("添加应用")}</b><div class="meta">${t("从开始菜单和 C 盘找到的程序")}</div>
    <div class="plist" id="pl"><div class="empty">${t("扫描中…")}</div></div>
    <div class="row"><button id="br">${t("浏览 C 盘")}</button><span style="flex:1"></span><button id="c">${t("关闭")}</button></div>`, async (d) => {
    d.querySelector("#c").onclick = () => d.close();
    d.querySelector("#br").onclick = () => browse(d, name, "C:\\");
    const progs = await call("Programs", name);
    d.querySelector("#pl").innerHTML = progs.map((pr, i) => `<div class="prow">${pr.icon ? `<img src="${pr.icon}">` : `<span class="ph"></span>`}
      <div class="grow"><b>${esc(pr.name)}</b> <span class="tag">${pr.from === "start-menu" ? t("开始菜单") : t("扫描")}</span><div class="sub">${esc(pr.exe)} ${esc(pr.args || "")}</div></div>
      <button data-i="${i}">${t("添加")}</button></div>`).join("") || `<div class="empty">${t("没找到程序。用“浏览 C 盘”手动选。")}</div>`;
    d.querySelectorAll("[data-i]").forEach((b) => b.onclick = () => doAdd(d, name, progs[+b.dataset.i]));
  });
}

async function doAdd(d, name, prog) {
  const label = await ask(t("应用名称（菜单里显示的名字）"), prog.name);
  if (!label) return;
  try { await call("AddApp", name, { name: label, exe: prog.exe, args: prog.args || "", workdir: prog.workdir || "", from: prog.from || "manual" }); d.close(); await load(); }
  catch (e) { fail(e); }
}

// browse lists a drive_c folder in the dialog; act is what a program's
// button does (adding it as an app, unless told otherwise).
async function browse(d, name, path, act = { label: t("添加"), fn: (e) => doAdd(d, name, { name: e.name.replace(/\.exe$/i, ""), exe: e.path, from: "manual" }) }) {
  let ents;
  try { ents = await call("Browse", name, path); } catch (e) { fail(e); return; }
  const up = path.replace(/\\[^\\]+\\?$/, "") || "C:";
  d.querySelector("#pl").innerHTML = `<div class="crumb">${esc(path)}</div>` +
    (path.length > 3 ? `<div class="prow" data-up="1"><span class="ph"></span><div class="grow">..</div></div>` : "") +
    ents.map((e, i) => `<div class="prow" data-j="${i}"><span class="ph">${e.dir ? "📁" : "⚙"}</span><div class="grow">${esc(e.name)}</div>${e.dir ? "" : `<button data-k="${i}">${act.label}</button>`}</div>`).join("");
  const upRow = d.querySelector("[data-up]"); if (upRow) upRow.onclick = () => browse(d, name, up.length <= 2 ? "C:\\" : up, act);
  d.querySelectorAll("[data-j]").forEach((r) => { const e = ents[+r.dataset.j]; if (e.dir) r.onclick = () => browse(d, name, e.path, act); });
  d.querySelectorAll("[data-k]").forEach((b) => b.onclick = (ev) => { ev.stopPropagation(); act.fn(ents[+b.dataset.k]); });
}

async function newPrefix() {
  if (!env.runners.length) { openSettings("runner"); return; }
  const pr = await call("Prefs");
  dialog(`<b>${t("新建 prefix")}</b><div class="meta">${t("名称")}</div><input id="n" placeholder="${t("例如 wechat")}">
    <div class="meta">runner</div><select id="r">${env.runners.map((r) => `<option value="${esc(r.name)}" ${r.default ? "selected" : ""}>${esc(r.name)} — ${esc(r.version)}${r.problems && r.problems.length ? t("（{0}）", t("⚠ 缺 32 位支持")) : ""}</option>`).join("")}</select>
    <div class="meta">${t("区域")} · ${LOCALE_NOTE()}</div>${localeField(env.host_locale)}
    <div class="meta">${t("字体")}</div>${fontField(env.default_font_sets, "", pr.fonts.core)}
    <div id="e" class="err"></div><div class="row"><button id="c">${t("取消")}</button><button id="k" class="primary">${t("创建")}</button></div>`, (d) => {
    d.querySelector("#c").onclick = () => d.close();
    // The region decides CJK until the boxes are touched.
    let touched = false;
    d.querySelectorAll(".fsets input").forEach((b) => b.addEventListener("change", () => { touched = true; }));
    wireLocale(d, (l) => {
      const cjk = d.querySelector('.fsets input[value="cjk"]');
      if (!touched && l && !cjk.disabled) cjk.checked = !!l.cjk;
    });
    wireFonts(d);
    showFontStatus(d);
    d.querySelector("#k").onclick = async () => {
      const n = d.querySelector("#n").value.trim();
      const k = d.querySelector("#k");
      k.disabled = true; k.textContent = t("创建中…");
      try { const id = await call("Create", n, d.querySelector("#r").value, readLocale(d), readFonts(d), readCore(d)); sel = n; d.close(); await load(); if (id) watchTask(n, id); }
      catch (e) { d.querySelector("#e").textContent = e.message || e; k.disabled = false; k.textContent = t("创建"); }
    };
  });
}

window.addEventListener("focus", () => load(false).catch(() => {}));
setInterval(() => { if (!document.hidden && sel && sel !== SETTINGS && $("#runs")) showRuns(sel).catch(() => {}); }, 2000);
load().catch((e) => { $("#main").innerHTML = `<div class="err">${esc(e.message || e)}</div>`; });
</script>
